<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Pulse · music gear &amp; DJ · @Llllhhhhhhhhhhhh22</title>
<meta name="description" content="What music gear, DJ and production channels are getting views this week.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--panel:#1b1b1b;--line:#2b2b2b;--ink:#f1f1f1;--muted:#a3a3a3;--red:#ff0033}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,sans-serif;font-size:15px;line-height:1.45}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:5;background:rgba(15,15,15,.96);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;margin-right:auto}
.logo i{display:inline-block;width:30px;height:21px;background:var(--red);border-radius:6px;position:relative}
.logo i:after{content:"";position:absolute;left:12px;top:5px;border-left:9px solid #fff;border-top:5.5px solid transparent;border-bottom:5.5px solid transparent}
nav a{padding:6px 12px;border-radius:8px;background:#272727;margin:2px;display:inline-block;font-weight:500}nav a.on{background:var(--ink);color:#0f0f0f}
select{background:#272727;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
h1{font-size:28px;margin:26px 0 4px;font-weight:900}.sub{color:var(--muted);margin:0 0 18px}
h2{font-size:20px;margin:0 0 4px;font-weight:700}.note{color:var(--muted);margin:0 0 14px;font-size:14px}
section{padding:20px 0;border-top:1px solid var(--line)}
.you{display:flex;gap:16px;align-items:center;background:var(--panel);border-radius:14px;padding:16px;margin-bottom:16px;border-left:4px solid var(--red)}
.av{width:56px;height:56px;border-radius:50%;background:#333;display:grid;place-items:center;font-weight:900;font-size:22px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--panel);border-radius:12px;padding:12px 14px}.kpi .v{font-size:26px;font-weight:900}.kpi .l{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px 16px}
.v .th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#222}
.v .th img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700}
.badge.s{background:var(--red)}
.rk{position:absolute;left:6px;top:6px;background:var(--red);border-radius:4px;padding:1px 7px;font-weight:900;font-size:13px}
.v h3{font-size:15px;font-weight:500;margin:10px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v .m{color:var(--muted);font-size:13px}.v .m b{color:var(--ink)}
.chip{display:inline-block;background:#272727;border-radius:6px;padding:1px 8px;font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px}td.r,th.r{text-align:right}
.tbl{overflow-x:auto;background:var(--panel);border-radius:12px;padding:4px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.frow{display:grid;grid-template-columns:180px 1fr 110px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.track{height:10px;background:#272727;border-radius:5px;overflow:hidden}.fill{height:100%;background:var(--red)}
.kw{display:flex;flex-wrap:wrap;gap:8px}.kw span{background:#272727;border-radius:16px;padding:4px 12px}.kw small{color:var(--muted)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.idea{background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.idea h3{margin:0;font-size:17px}.idea .hook{font-size:16px;border-left:3px solid var(--red);padding-left:10px}
.idea ol{margin:0;padding-left:20px;color:#d6d6d6}.idea .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.btn{align-self:flex-start;background:var(--ink);color:#0f0f0f;border:0;border-radius:18px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
.small{color:var(--muted);font-size:13px}
footer{padding:20px 0 50px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
@media(max-width:560px){.ideas{grid-template-columns:1fr}.frow{grid-template-columns:120px 1fr 80px}}
</style>
</head>
<body>
<header><div class="wrap bar"><div class="logo"><i></i><span data-i18n="yt_title"></span></div><nav id="nav"></nav><select id="lang" aria-label="Language"></select></div></header>
<main class="wrap">
 <h1 data-i18n="yt_title"></h1><p class="sub" data-i18n="yt_sub"></p>
 <div class="you" id="you"></div>
 <div class="kpis" id="kpis"></div>
 <section style="margin-top:20px"><h2 data-i18n="hot_title"></h2><p class="note" id="hotnote"></p><div class="grid" id="hot"></div></section>
 <section><h2 data-i18n="top_title"></h2><p class="note" id="topnote"></p><div class="grid" id="top"></div></section>
 <section class="two"><div><h2 data-i18n="formats_title"></h2><p class="note" id="fmtnote"></p><div id="fmts"></div></div><div><h2 data-i18n="keywords_title"></h2><p class="note" id="kwnote"></p><div class="kw" id="kw"></div></div></section>
 <section><h2 data-i18n="ideas_title"></h2><p class="note" data-i18n="ideas_note"></p><div class="ideas" id="ideas"></div></section>
 <section><h2 data-i18n="roster_title"></h2><p class="note" id="rnote"></p><div class="tbl"><table id="roster"></table></div></section>
</main>
<footer class="wrap" id="foot"></footer>
<script src="../social-i18n.js"></script>
<script>
var t=SI.t;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
(function(){var q=SI.lang!=='en'?'?lang='+SI.lang:'';var b=[['../','nav_x'],['../instagram/','nav_ig'],['../tiktok/','nav_tt'],['../youtube/','nav_yt']];
 document.getElementById('nav').innerHTML=b.map(function(x){return '<a class="'+(x[1]==='nav_yt'?'on':'')+'" href="'+x[0]+q+'">'+esc(t(x[1]))+'</a>'}).join('')})();
SI.apply();SI.picker(document.getElementById('lang'));
document.addEventListener('click',function(e){var b=e.target.closest('[data-copy]');if(!b)return;navigator.clipboard&&navigator.clipboard.writeText(b.getAttribute('data-copy'));b.textContent=t('copied');setTimeout(function(){b.textContent=t('copy')},1500)});
fetch('data.json',{cache:'no-store'}).then(function(r){return r.json()}).then(render).catch(function(){document.getElementById('hot').textContent=t('failed')});
function card(p,i){return '<a class="v" href="'+esc(p.url)+'" target="_blank" rel="noopener"><div class="th"><img loading="lazy" src="'+esc(p.thumb)+'" alt="">'+(i!=null?'<span class="rk">#'+(i+1)+'</span>':'')+'<span class="badge'+(p.short?' s':'')+'">'+esc(t(p.short?'yt_short':'yt_long'))+'</span></div>'+
 '<h3>'+esc(p.title)+'</h3><div class="m">'+esc(p.name)+'</div><div class="m"><b>'+SI.num(p.views)+'</b> '+esc(t('views'))+' · '+esc(SI.ago(p.age_h))+' · '+esc(t('per_hour',{n:SI.num(p.vph)}))+'</div><span class="chip">'+esc(t('fmt_'+p.format))+'</span></a>'}
function render(d){
 var o=d.operator,s=d.summary,w=t('window',{n:d.window_days});
 var st={private:'status_private',empty:'status_empty',unavailable:'status_unavailable',ok:'status_ok'}[o.status]||'status_ok';
 document.getElementById('you').innerHTML='<div class="av">'+esc((o.name||o.handle||'?').charAt(0))+'</div><div><div><b>'+esc(t('you'))+':</b> <a href="'+esc(o.url)+'" target="_blank" rel="noopener">@'+esc(o.handle)+'</a> '+(o.name?'· '+esc(o.name):'')+'</div><div class="small">'+esc(t(st))+(o.followers!=null?' · '+SI.num(o.followers)+' '+esc(t('subscribers')):'')+'</div><div class="small">'+esc(t('updated',{date:SI.date(d.fetched_at)}))+'</div></div>'+
  (o.posts&&o.posts.length?'<div class="grid">'+o.posts.slice(0,3).map(function(p){return card(p)}).join('')+'</div>':'');
 var k=[[s.posts_window,'k_posts'],[s.views_window,'k_views'],[s.median_views,'k_median'],[s.over_100k,'k_100k'],[s.followers_total,'k_followers'],[s.accounts_ok,'k_accounts']];
 document.getElementById('kpis').innerHTML=k.map(function(x){return '<div class="kpi"><div class="v">'+SI.num(x[0])+'</div><div class="l">'+esc(t(x[1]))+(x[1]==='k_followers'||x[1]==='k_accounts'?'':' · '+esc(w))+'</div></div>'}).join('');
 document.getElementById('hotnote').textContent=t('hot_note')+' ('+w+')';
 document.getElementById('hot').innerHTML=d.hot.slice(0,12).map(card).join('');
 document.getElementById('topnote').textContent=w;
 document.getElementById('top').innerHTML=d.top_views.slice(0,8).map(card).join('');
 var mx=Math.max.apply(null,d.formats.map(function(f){return f.median_views}).concat([1]));
 document.getElementById('fmtnote').textContent=t('k_median')+' · '+w;
 document.getElementById('fmts').innerHTML=d.formats.map(function(f){return '<div class="frow"><span>'+esc(t('fmt_'+f.key))+'</span><div class="track"><div class="fill" style="width:'+Math.max(3,100*f.median_views/mx)+'%"></div></div><span>'+SI.num(f.median_views)+' <span class="small">('+f.count+')</span></span></div>'}).join('');
 document.getElementById('kwnote').textContent=w;
 document.getElementById('kw').innerHTML=d.keywords.slice(0,18).map(function(k){return '<span>'+esc(k.k)+' <small>×'+k.authors+'</small></span>'}).join('');
 document.getElementById('ideas').innerHTML=d.ideas.map(function(x){return '<article class="idea"><div class="lbl">'+esc(t('fmt_'+(x.format==='short'?'short':x.format)))+' · '+esc(x.length)+'</div><h3>'+esc(x.title)+'</h3><div class="lbl">'+esc(t('hook'))+'</div><div class="hook">'+esc(x.hook)+'</div><div class="lbl">'+esc(t('script'))+'</div><ol>'+x.script.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>'+
  '<div class="lbl">'+esc(t('caption'))+'</div><div>'+esc(x.caption)+' <span class="small">'+esc(x.hashtags)+'</span></div><button class="btn" data-copy="'+esc(x.title+'\n\n'+x.caption+'\n\n'+x.hashtags)+'">'+esc(t('copy'))+'</button>'+
  '<div class="small">'+esc(t('modeled_on'))+': <a href="'+esc(x.modeled_on.url)+'" target="_blank" rel="noopener">'+esc(x.modeled_on.handle)+' · '+esc(x.modeled_on.title)+'</a> · '+SI.num(x.modeled_on.views)+' '+esc(t('views'))+' ('+esc(x.modeled_on.as_of)+')</div></article>'}).join('');
 document.getElementById('rnote').textContent=w;
 document.getElementById('roster').innerHTML='<tr><th>'+esc(t('rank'))+'</th><th>'+esc(t('account'))+'</th><th class="r">'+esc(t('subscribers'))+'</th><th class="r">'+esc(t('in_window'))+'</th><th class="r">'+esc(t('best'))+'</th><th class="r">'+esc(t('total'))+'</th></tr>'+
  d.roster.map(function(r){return '<tr><td>'+r.rank+'</td><td><a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.name)+'</a>'+(r.error?' <span class="small">'+esc(t('na'))+'</span>':'')+'</td><td class="r">'+SI.num(r.followers)+'</td><td class="r">'+SI.full(r.posts_window)+'</td><td class="r">'+SI.num(r.best_views)+'</td><td class="r">'+SI.num(r.total_views)+'</td></tr>'}).join('');
 document.getElementById('foot').innerHTML='<h3>'+esc(t('limits_title'))+'</h3><ul>'+d.limits.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><h3>'+esc(t('sources_title'))+'</h3><ul>'+d.sources.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><p>'+esc(t('footer'))+'</p>';
}
</script>
</body>
</html>
