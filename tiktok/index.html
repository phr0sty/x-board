<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hot Board · TikTok · @jcizzle05</title>
<meta name="description" content="What's blowing up in music, DJ and gear TikTok, and how to copy the format.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--ink:#14121f;--pink:#ff2d87;--cyan:#16e0e0;--yellow:#ffe14d;--purple:#7b5cff;--lime:#b6f23a;--card:#fff;--muted:#5d5873}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Rubik,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;margin-right:auto}
.logo span{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.pills a{display:inline-block;padding:6px 12px;border-radius:999px;background:#2a2740;color:#fff;text-decoration:none;font-weight:600;font-size:14px;margin:2px}
.pills a.on{background:var(--pink)}
select{font:inherit;font-size:14px;padding:6px 10px;border-radius:999px;border:0;background:var(--yellow);color:var(--ink);font-weight:600}
.hero{padding:34px 0 16px}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1;margin:0 0 12px;font-weight:900;letter-spacing:-1.5px}
.hero p{font-size:19px;color:var(--muted);margin:0 0 18px;max-width:640px}
.steps{display:flex;gap:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:800;box-shadow:4px 4px 0 var(--ink)}
.step b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff}
.step:nth-child(2) b{background:var(--purple)}.step:nth-child(3) b{background:#0aa}
section{padding:22px 0}
h2{font-size:30px;font-weight:900;margin:0 0 6px;letter-spacing:-.5px}
.note{color:var(--muted);margin:0 0 16px;font-size:15px}
.you{display:flex;gap:16px;align-items:center;background:var(--yellow);border:3px solid var(--ink);border-radius:24px;padding:18px;box-shadow:6px 6px 0 var(--ink);flex-wrap:wrap}
.you .big{font-size:40px}
.you h3{margin:0;font-size:22px;font-weight:900}.you p{margin:4px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.kpi{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 14px}
.kpi .v{font-size:30px;font-weight:900}.kpi .l{font-size:14px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column}
.cover{position:relative;aspect-ratio:3/4;background:linear-gradient(135deg,var(--purple),var(--pink));overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.rankb{position:absolute;top:10px;left:10px;background:var(--yellow);border:3px solid var(--ink);border-radius:14px;font-weight:900;padding:2px 10px;font-size:20px}
.plays{position:absolute;bottom:10px;left:10px;right:10px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7);font-weight:900;font-size:30px;line-height:1}
.plays small{display:block;font-size:14px;font-weight:600}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.who{font-weight:800}.desc{font-size:15px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;align-self:flex-start;background:var(--cyan);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
.why{background:#f2efff;border-radius:14px;padding:8px 10px;font-size:14px}
.why b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--purple)}
.btn{display:inline-block;text-align:center;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:10px 14px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
.btn.pink{background:var(--pink)}
.fmt{display:grid;gap:10px}
.frow{display:grid;grid-template-columns:minmax(150px,240px) 1fr auto;gap:10px;align-items:center;font-weight:700}
.track{background:#ece6d8;border-radius:999px;height:22px;overflow:hidden}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--purple))}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.idea{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:16px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:10px}
.ideaimg{width:100%;aspect-ratio:9/16;max-height:420px;object-fit:cover;border-radius:16px;border:3px solid var(--ink)}
.idea h3{margin:0;font-size:21px;font-weight:900}
.hook{font-size:20px;font-weight:800;background:var(--lime);border-radius:14px;padding:10px 12px}
.idea ol{margin:0;padding-left:22px}.idea li{margin:4px 0}
.cap{background:#fff3f8;border:2px dashed var(--pink);border-radius:14px;padding:10px;font-size:15px}
.meta{font-size:13px;color:var(--muted)}
.list{background:var(--card);border:3px solid var(--ink);border-radius:24px;overflow:hidden}
.li{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:2px solid #f0eadc}
.li:last-child{border-bottom:0}.li .n{font-weight:900;font-size:20px;color:var(--pink)}
.li .s{text-align:right;font-weight:800}.li .s small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.small{font-size:14px;color:var(--muted)}
footer{padding:30px 0 50px;color:var(--muted);font-size:14px}
footer ul{padding-left:18px}
@media(max-width:560px){.frow{grid-template-columns:1fr auto}.frow .track{grid-column:1/-1}.li{grid-template-columns:34px 1fr auto}.li .s2{display:none}}
</style>
</head>
<body>
<header><div class="wrap bar">
 <div class="logo">🎧 <span>Hot Board</span></div>
 <nav class="pills" id="nav"></nav>
 <select id="lang" aria-label="Language"></select>
</div></header>
<main class="wrap">
 <div class="hero">
  <h1 data-i18n="tt_hero"></h1>
  <p data-i18n="tt_sub"></p>
  <div class="steps"><div class="step"><b>1</b><span data-i18n="tt_step1"></span></div><div class="step"><b>2</b><span data-i18n="tt_step2"></span></div><div class="step"><b>3</b><span data-i18n="tt_step3"></span></div></div>
 </div>
 <section><div class="you" id="you"></div><div class="kpis" id="kpis"></div></section>
 <section><h2>🔥 <span data-i18n="hot_title"></span></h2><p class="note" id="hotnote"></p><div class="grid" id="hot"></div></section>
 <section><h2>📊 <span data-i18n="formats_title"></span></h2><p class="note" id="fmtnote"></p><div class="fmt" id="fmts"></div></section>
 <section><h2>✍️ <span data-i18n="ideas_title"></span></h2><p class="note" data-i18n="ideas_note"></p><div class="ideas" id="ideas"></div></section>
 <section><h2>👀 <span data-i18n="roster_title"></span></h2><div class="list" id="roster"></div></section>
</main>
<footer class="wrap" id="foot"></footer>
<script src="../social-i18n.js"></script>
<script>
var ORIG={en:'✨ Original idea (not modelled on a specific post)',ru:'✨ Оригинальная идея (не по мотивам конкретного поста)',es:'✨ Idea original (no basada en una publicación concreta)',pt:'✨ Ideia original (não inspirada em um post específico)',fr:'✨ Idée originale (pas inspirée d\'une publication précise)',de:'✨ Eigene Idee (kein bestimmter Beitrag als Vorbild)',ja:'✨ オリジナルのアイデア（特定の投稿が元ではありません）',ko:'✨ 오리지널 아이디어 (특정 게시물을 참고하지 않음)',zh:'✨ 原创点子（并非参考某个具体内容）'};
var t=SI.t, EMO={transition:'🔀',tutorial:'💡',build:'🛠️',gear:'🎛️',live:'🙌',release:'📣',other:'✨',short:'⚡'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nav(cur){var q=SI.lang!=='en'?'?lang='+SI.lang:'';var b=[['../','nav_x','x'],['../instagram/','nav_ig','ig'],['../tiktok/','nav_tt','tt'],['../youtube/','nav_yt','yt']];
 document.getElementById('nav').innerHTML=b.map(function(x){return '<a class="'+(x[2]===cur?'on':'')+'" href="'+x[0]+q+'">'+esc(t(x[1]))+'</a>'}).join('')}
SI.apply();SI.picker(document.getElementById('lang'));nav('tt');
function copyBtn(text){return '<button class="btn pink" data-copy="'+esc(text)+'">📋 '+esc(t('copy'))+'</button>'}
document.addEventListener('click',function(e){var b=e.target.closest('[data-copy]');if(!b)return;navigator.clipboard&&navigator.clipboard.writeText(b.getAttribute('data-copy'));b.textContent='✅ '+t('copied');setTimeout(function(){b.textContent='📋 '+t('copy')},1500)});
fetch('data.json',{cache:'no-store'}).then(function(r){return r.json()}).then(render).catch(function(){document.getElementById('hot').textContent=t('failed')});
function render(d){
 var o=d.operator, s=d.summary;
 var st={private:['🔒','status_private'],empty:['🌱','status_empty'],unavailable:['⏳','status_unavailable'],ok:['✅','status_ok']}[o.status]||['✅','status_ok'];
 document.getElementById('you').innerHTML='<div class="big">'+st[0]+'</div><div><h3>'+esc(t('you'))+': <a href="'+esc(o.url)+'" target="_blank" rel="noopener">@'+esc(o.handle)+'</a></h3><p>'+esc(t(st[1]))+'</p>'+
  (o.status==='ok'?'<p><b>'+SI.num(o.followers)+'</b> '+esc(t('followers'))+' · <b>'+SI.num(o.likes_total)+'</b> '+esc(t('total_likes'))+'</p>':'')+'<p class="small">'+esc(t('updated',{date:SI.date(d.fetched_at)}))+'</p></div>';
 var k=[[s.posts_window,'k_posts'],[s.views_window,'k_views'],[s.median_views,'k_median'],[s.over_1m,'k_1m'],[s.accounts_ok,'k_accounts']];
 document.getElementById('kpis').innerHTML=k.map(function(x){return '<div class="kpi"><div class="v">'+SI.num(x[0])+'</div><div class="l">'+esc(t(x[1]))+' · '+esc(t('window',{n:d.window_days}))+'</div></div>'}).join('');
 document.getElementById('hotnote').textContent=t('hot_note')+' ('+t('window',{n:d.window_days})+')';
 document.getElementById('hot').innerHTML=d.hot.slice(0,12).map(function(p,i){return '<article class="card"><div class="cover">'+(p.thumb?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(p.thumb)+'" alt="" onerror="this.remove()">':'')+
  '<div class="rankb">#'+(i+1)+'</div><div class="plays">'+SI.num(p.views)+' <small>'+esc(t('plays'))+' · '+esc(t('per_hour',{n:SI.num(p.vph)}))+'</small></div></div>'+
  '<div class="body"><div class="who">@'+esc(p.handle)+' <span class="small">· '+esc(SI.ago(p.age_h))+'</span></div><div class="desc">'+esc(p.title)+'</div>'+
  '<span class="chip">'+EMO[p.format]+' '+esc(t('fmt_'+p.format))+'</span><div class="why"><b>'+esc(t('tt_why'))+'</b>'+esc(t('why_'+p.format))+'</div>'+
  '<a class="btn" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(t('tt_watch'))+'</a></div></article>'}).join('');
 var mx=Math.max.apply(null,d.formats.map(function(f){return f.median_views}).concat([1]));
 document.getElementById('fmtnote').textContent=t('k_median')+' · '+t('window',{n:d.window_days});
 document.getElementById('fmts').innerHTML=d.formats.map(function(f){return '<div class="frow"><div>'+EMO[f.key]+' '+esc(t('fmt_'+f.key))+'</div><div class="track"><div class="fill" style="width:'+Math.max(4,100*f.median_views/mx)+'%"></div></div><div>'+SI.num(f.median_views)+' <span class="small">· '+f.count+' '+esc(t('count'))+'</span></div></div>'}).join('');
 document.getElementById('ideas').innerHTML=d.ideas.map(function(x){var cap=x.caption+'\n\n'+x.hashtags;return '<article class="idea">'+(x.image?'<img class="ideaimg" loading="lazy" src="'+esc(x.image)+'" alt="'+esc(x.image_alt||x.title)+'">':'')+'<span class="chip">'+(x.original?'🆕 ':'')+(EMO[x.format]||'✨')+' '+esc(t('fmt_'+x.format))+' · '+esc(x.length)+'</span><h3>'+esc(x.title)+'</h3>'+
  '<div class="hook">🎣 '+esc(x.hook)+'</div><div><b>'+esc(t('tt_copy_this'))+'</b><ol>'+x.script.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol></div>'+
  '<div class="cap"><b>'+esc(t('caption'))+':</b> '+esc(x.caption)+'<br><b>'+esc(t('hashtags'))+':</b> '+esc(x.hashtags)+'</div>'+copyBtn(cap)+
  (x.modeled_on?'<div class="meta">'+esc(t('modeled_on'))+': <a href="'+esc(x.modeled_on.url)+'" target="_blank" rel="noopener">@'+esc(x.modeled_on.handle)+' · '+esc(x.modeled_on.title)+'</a> · '+SI.num(x.modeled_on.views)+' '+esc(t('plays'))+' ('+esc(x.modeled_on.as_of)+')</div>':'<div class="meta">'+esc(ORIG[SI.lang]||ORIG.en)+'</div>')+'</article>'}).join('');
 document.getElementById('roster').innerHTML=d.roster.map(function(r){return '<div class="li"><div class="n">'+r.rank+'</div><div><a href="'+esc(r.url)+'" target="_blank" rel="noopener"><b>@'+esc(r.handle)+'</b></a><div class="small">'+esc(r.name||'')+(r.error?' · '+esc(t('na')):'')+'</div></div>'+
  '<div class="s s2">'+SI.num(r.followers)+'<small>'+esc(t('followers'))+'</small></div><div class="s">'+SI.num(r.best_views)+'<small>'+esc(t('best'))+'</small></div></div>'}).join('');
 document.getElementById('foot').innerHTML='<h3>'+esc(t('limits_title'))+'</h3><ul>'+d.limits.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><h3>'+esc(t('sources_title'))+'</h3><ul>'+d.sources.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><p>'+esc(t('footer'))+'</p>';
}
</script>
</body>
</html>
