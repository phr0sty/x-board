<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Index · Instagram · @sumofmyparts</title>
<meta name="description" content="An edited record of sound, gear and the people who move rooms.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#f5f0e6;--paper:#faf7f1;--ink:#111;--soft:#6f6a60;--rule:#1111112e}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}a:hover{border-bottom-color:var(--ink)}
.sans{font-family:Jost,Helvetica,sans-serif;font-weight:400;letter-spacing:.22em;text-transform:uppercase;font-size:11px}
.wrap{max-width:1060px;margin:0 auto;padding:0 28px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--rule)}
select{background:transparent;border:0;border-bottom:1px solid var(--ink);font-family:Jost,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:2px 0;color:var(--ink);border-radius:0}
.mast{text-align:center;padding:74px 0 46px;border-bottom:1px solid var(--ink)}
.mast h1{font-family:"Bodoni Moda",Didot,serif;font-weight:400;font-size:clamp(52px,11vw,128px);letter-spacing:.14em;margin:0;line-height:1;text-transform:uppercase}
.mast p{font-style:italic;font-size:21px;color:var(--soft);margin:22px auto 0;max-width:520px}
.navx{text-align:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.navx a{margin:0 14px}.navx a.on{border-bottom-color:var(--ink)}
section{padding:70px 0;border-bottom:1px solid var(--rule)}
.sh{display:grid;grid-template-columns:90px 1fr;gap:18px;align-items:baseline;margin-bottom:34px}
.sh .no{font-family:"Bodoni Moda",serif;font-size:15px;letter-spacing:.2em}
.sh h2{font-family:"Bodoni Moda",serif;font-weight:400;font-size:clamp(30px,4.6vw,46px);margin:0;line-height:1.1}
.sh p{grid-column:2;margin:10px 0 0;color:var(--soft);font-style:italic;max-width:640px}
.you{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.you>div{padding:26px 20px;border-left:1px solid var(--rule)}.you>div:first-child{border-left:0;padding-left:0}
.num{font-family:"Bodoni Moda",serif;font-size:46px;line-height:1}
.you .h{font-family:"Bodoni Moda",serif;font-style:italic;font-size:28px}
.status{margin:18px 0 0;color:var(--soft);font-style:italic}
.sig{list-style:none;margin:0;padding:0}
.sig li{display:grid;grid-template-columns:70px 120px 1fr 150px;gap:24px;align-items:center;padding:22px 0;border-top:1px solid var(--rule)}
.sig li:last-child{border-bottom:1px solid var(--rule)}
.sig .r{font-family:"Bodoni Moda",serif;font-size:40px;line-height:1}
.sig .im{width:120px;height:120px;overflow:hidden;background:#e7e0d2}
.sig .im img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:filter .6s}
.sig li:hover img{filter:none}
.sig .tt{font-style:italic;font-size:21px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sig .v{text-align:right}.sig .v .num{font-size:34px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border-top:1px solid var(--ink)}
.fm div{padding:26px 20px 26px 0;border-bottom:1px solid var(--rule)}
.fm .k{font-family:"Bodoni Moda",serif;font-size:24px}.fm .num{font-size:38px;margin-top:8px}
.ideas{counter-reset:c}
.idea{display:grid;grid-template-columns:90px 1fr;gap:18px;padding:40px 0;border-top:1px solid var(--rule)}
.idea .c{font-family:"Bodoni Moda",serif;font-size:56px;line-height:1}
.idea h3{font-family:"Bodoni Moda",serif;font-weight:400;font-size:30px;margin:0 0 6px}
.idea .hook{font-style:italic;font-size:24px;margin:14px 0}
.idea ol{margin:10px 0;padding-left:20px}
.idea .cap{border-left:1px solid var(--ink);padding:4px 0 4px 18px;margin:16px 0}
.btn{background:none;border:1px solid var(--ink);padding:9px 20px;cursor:pointer;font-family:Jost,sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
.btn:hover{background:var(--ink);color:var(--cream)}
.reg{width:100%;border-collapse:collapse}
.reg th{text-align:left;font-weight:400;padding:10px 8px;border-bottom:1px solid var(--ink)}
.reg td{padding:14px 8px;border-bottom:1px solid var(--rule)}.reg .rr{text-align:right;font-family:"Bodoni Moda",serif}
.reg td.n{font-family:"Bodoni Moda",serif;width:56px}
.reg .nm{font-family:"Bodoni Moda",serif;font-size:20px}
.colo{padding:60px 0 90px;color:var(--soft);font-size:16px}
.colo h3{font-family:Jost,sans-serif;font-weight:400;letter-spacing:.22em;text-transform:uppercase;font-size:11px;color:var(--ink);margin:30px 0 8px}
.colo ul{padding-left:18px;margin:0}
@media(max-width:720px){.you{grid-template-columns:1fr 1fr}.you>div:first-child{grid-column:1/-1;border-bottom:1px solid var(--rule)}.you>div:nth-child(2){border-left:0;padding-left:0}
 .sig li{grid-template-columns:44px 80px 1fr;gap:14px}.sig .im{width:80px;height:80px}.sig .v{grid-column:3;text-align:left}.sig .r{font-size:28px}
 .sh,.idea{grid-template-columns:1fr}.sh p{grid-column:1}.idea .c{font-size:40px}.reg .hide{display:none}.wrap{padding:0 18px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><span class="sans" id="issue"></span><select id="lang" aria-label="Language"></select></div>
 <header class="mast"><h1 data-i18n="ig_masthead"></h1><p data-i18n="ig_sub"></p></header>
 <nav class="navx sans" id="nav"></nav>
 <section><div class="sh"><span class="no">I.</span><h2 data-i18n="you"></h2></div><div class="you" id="you"></div><p class="status" id="ystatus"></p></section>
 <section><div class="sh"><span class="no">II.</span><h2 data-i18n="signals_title"></h2><p data-i18n="signals_note"></p></div><ul class="sig" id="sig"></ul></section>
 <section><div class="sh"><span class="no">III.</span><h2 data-i18n="formats_title"></h2><p id="fmtnote"></p></div><div class="fm" id="fmts"></div></section>
 <section><div class="sh"><span class="no">IV.</span><h2 data-i18n="ideas_title"></h2><p data-i18n="ideas_note"></p></div><div class="ideas" id="ideas"></div></section>
 <section><div class="sh"><span class="no">V.</span><h2 data-i18n="roster_title"></h2><p id="rnote"></p></div><table class="reg" id="roster"></table></section>
 <footer class="colo" id="foot"></footer>
</div>
<script src="../social-i18n.js"></script>
<script>
var t=SI.t;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
(function(){var q=SI.lang!=='en'?'?lang='+SI.lang:'';var b=[['../','nav_x'],['../instagram/','nav_ig'],['../tiktok/','nav_tt'],['../youtube/','nav_yt']];
 document.getElementById('nav').innerHTML=b.map(function(x){return '<a class="'+(x[1]==='nav_ig'?'on':'')+'" href="'+x[0]+q+'">'+esc(t(x[1]))+'</a>'}).join('')})();
SI.apply();SI.picker(document.getElementById('lang'));
function pad(n){return (n<10?'0':'')+n}
document.addEventListener('click',function(e){var b=e.target.closest('[data-copy]');if(!b)return;navigator.clipboard&&navigator.clipboard.writeText(b.getAttribute('data-copy'));b.textContent=t('copied');setTimeout(function(){b.textContent=t('copy')},1500)});
fetch('data.json',{cache:'no-store'}).then(function(r){return r.json()}).then(render).catch(function(){document.getElementById('sig').textContent=t('failed')});
function render(d){
 var o=d.operator,s=d.summary;
 document.getElementById('issue').textContent=t('ig_issue',{date:SI.date(d.fetched_at,{year:'numeric',month:'long',day:'numeric'})});
 document.getElementById('you').innerHTML='<div><div class="sans">'+esc(t('account'))+'</div><div class="h"><a href="'+esc(o.url)+'" target="_blank" rel="noopener">@'+esc(o.handle)+'</a></div></div>'+
  '<div><div class="sans">'+esc(t('followers'))+'</div><div class="num">'+SI.full(o.followers)+'</div></div><div><div class="sans">'+esc(t('posts'))+'</div><div class="num">'+SI.full(o.posts_count)+'</div></div>'+
  '<div><div class="sans">'+esc(t('k_median_followers'))+' · '+esc(t('roster_title'))+'</div><div class="num">'+SI.num(s.median_followers)+'</div></div>';
 var st={private:'status_private',empty:'status_empty',unavailable:'status_unavailable',ok:'status_ok'}[o.status]||'status_ok';
 document.getElementById('ystatus').textContent=t(st)+' '+t('updated',{date:SI.date(d.fetched_at)});
 document.getElementById('sig').innerHTML=(d.signals||[]).map(function(p,i){return '<li><span class="r">'+pad(i+1)+'</span><a class="im" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+(p.thumb?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(p.thumb)+'" alt="" onerror="this.remove()">':'')+'</a>'+
  '<div><div class="tt"><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.title||'—')+'</a></div><div class="sans" style="margin-top:8px">@'+esc(p.handle)+' · '+esc(t(p.source==='tiktok'?'source_tiktok':'source_youtube'))+' · '+esc(t('fmt_'+p.format))+'</div></div>'+
  '<div class="v"><div class="num">'+SI.num(p.views)+'</div><div class="sans">'+esc(t('views'))+' · '+esc(SI.ago(p.age_h))+'</div></div></li>'}).join('');
 document.getElementById('fmtnote').textContent=t('k_median')+' — '+t('signals_title');
 document.getElementById('fmts').innerHTML=(d.formats||[]).map(function(f){return '<div><div class="k">'+esc(t('fmt_'+f.key))+'</div><div class="num">'+SI.num(f.median_views)+'</div><div class="sans">'+esc(t('median'))+' · '+f.count+' '+esc(t('count'))+'</div></div>'}).join('');
 document.getElementById('ideas').innerHTML=d.ideas.map(function(x,i){return '<article class="idea"><div class="c">'+pad(i+1)+'</div><div><div class="sans">'+esc(t('fmt_'+x.format))+' · '+esc(x.length)+'</div><h3>'+esc(x.title)+'</h3><div class="hook">'+esc(x.hook)+'</div>'+
  '<div class="sans">'+esc(t('script'))+'</div><ol>'+x.script.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol><div class="cap"><div class="sans">'+esc(t('caption'))+'</div>'+esc(x.caption)+'<br><em>'+esc(x.hashtags)+'</em></div>'+
  '<button class="btn" data-copy="'+esc(x.caption+'\n\n'+x.hashtags)+'">'+esc(t('copy'))+'</button><p style="color:var(--soft);font-size:15px;margin:16px 0 0">'+esc(t('modeled_on'))+': <a href="'+esc(x.modeled_on.url)+'" target="_blank" rel="noopener"><em>'+esc(x.modeled_on.title)+'</em></a> — @'+esc(x.modeled_on.handle)+', '+SI.full(x.modeled_on.views)+' '+esc(t('views'))+' ('+esc(x.modeled_on.as_of)+')</p></div></article>'}).join('');
 document.getElementById('rnote').textContent=t('k_followers')+': '+SI.num(s.followers_total)+' · '+t('k_accounts')+': '+s.accounts_ok+'/'+s.accounts;
 document.getElementById('roster').innerHTML='<tr class="sans"><th>№</th><th>'+esc(t('account'))+'</th><th class="rr">'+esc(t('followers'))+'</th><th class="rr hide">'+esc(t('posts'))+'</th></tr>'+
  d.roster.map(function(r){return '<tr><td class="n">'+pad(r.rank)+'</td><td><a class="nm" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.name||r.handle)+'</a><div class="sans">@'+esc(r.handle)+(r.stale_from?' · '+esc(t('updated',{date:SI.date(r.stale_from,{month:'short',day:'numeric'})})):'')+'</div></td><td class="rr">'+(r.followers!=null?SI.num(r.followers):'<em>'+esc(t('na'))+'</em>')+'</td><td class="rr hide">'+(r.posts_count!=null?SI.full(r.posts_count):'—')+'</td></tr>'}).join('');
 document.getElementById('foot').innerHTML='<h3>'+esc(t('limits_title'))+'</h3><ul>'+d.limits.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><h3>'+esc(t('sources_title'))+'</h3><ul>'+d.sources.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><p style="margin-top:30px">'+esc(t('footer'))+'</p>';
}
</script>
</body>
</html>
