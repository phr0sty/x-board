name: Decode preview images

on:
  workflow_dispatch:

jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 jpg sources into media
        run: |
          set -euo pipefail
          mkdir -p media
          shopt -s nullglob

          decode_jpg() {
            local out="$1"
            header="$(dd if="$out" bs=1 count=3 status=none)"
            if [ "$header" != $'\xff\xd8\xff' ]; then
              echo "Invalid jpeg header in $out"
              exit 1
            fi
            ls -l "$out"
          }

          for src in media/src/*.jpg.b64; do
            [ -s "$src" ] || continue
            out="media/$(basename "$src" .b64)"
            echo "Decoding $src -> $out"
            base64 -d "$src" > "$out"
            decode_jpg "$out"
          done

          for dir in media/src/*.jpg.b64.parts; do
            [ -d "$dir" ] || continue
            base="$(basename "$dir" .parts)"
            out="media/$(basename "$base" .b64)"
            echo "Concatenating $dir -> $out"
            cat "$dir"/* | base64 -d > "$out"
            decode_jpg "$out"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/*.jpg
          if git diff --cached --quiet; then
            echo "No media changes to commit"
            exit 0
          fi
          git commit -m "Add SH6 card preview sheets to media/"
          git push
