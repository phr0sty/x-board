name: Decode persona images

on:
  workflow_dispatch:

jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 sources into media jpgs
        run: |
          set -euo pipefail
          mkdir -p media

          decode_and_check() {
            local out="$1"
            header="$(python3 -c "print(open('$out','rb').read(3).hex())")"
            if [ "$header" != "ffd8ff" ]; then
              echo "Invalid jpeg header in $out: $header"
              exit 1
            fi
            ls -l "$out"
          }

          shopt -s nullglob
          for src in media/src/*.jpg.b64; do
            [ -s "$src" ] || { echo "Skipping empty $src"; continue; }
            out="media/$(basename "$src" .b64)"
            echo "Decoding $src -> $out"
            base64 -d "$src" > "$out"
            decode_and_check "$out"
          done

          for dir in media/src/*.jpg.b64.parts; do
            [ -d "$dir" ] || continue
            base="$(basename "$dir" .parts)"
            out="media/$(basename "$base" .b64)"
            echo "Concatenating $dir -> $out"
            cat "$dir"/* | base64 -d > "$out"
            decode_and_check "$out"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/*.jpg
          if git diff --cached --quiet; then
            echo "No media changes to commit"
            exit 0
          fi
          git commit -m "Add decoded JPEG images to media/"
          git push
